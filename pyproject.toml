[project]
name = "network-lab"
version = "0.2.0"
description = "Python Network Data Path Simulator + Traffic Analyzer"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pyroute2>=0.7.9",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.110.0",
    "pyright>=1.1.370",
    "ruff>=0.6.0",
    "coverage>=7.6.0",
]

[project.scripts]
network-lab = "network_lab.cli.dashboard:run_cli"
network-lab-demo = "network_lab.demo:run_demo"
network-lab-benchmark = "network_lab.benchmark:run_benchmark"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
